name: Release · macOS

# It only runs when you ask for it, on a GitHub-hosted macOS (Apple Silicon) runner. The
# private engine repository is reached over HTTPS with the POM_LLAMACPP_TOKEN secret. See
# `docs/subsystems/build-and-run.md`, "Release through GitHub Actions".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  # The release the binary says it is; the update check compares it with the published ones.
  POM_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  # A single job. On a hosted runner the interface used to be built separately, on a
  # Linux runner, because the macOS minute cost 10x; here there is no multiplier, and
  # splitting would only add a round trip of artifacts between two jobs that
  # would run on the same machine anyway - the runner serves one job at a time.
  build:
    name: macOS arm64 (Metal)
    runs-on: macos-14
    env:
      LLAMA_SOURCE: ${{ github.workspace }}/.ci-cache/llama.cpp
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CCACHE: sccache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare/cache the llama.cpp checkout
        id: llama-cache
        uses: ./.github/actions/llama-cache

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Enable the build cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # No `Swatinem/rust-cache`: it exists to hand a `target/` to a
      # runner that starts empty. Here the workspace is the same between runs, the
      # `target/` is already there, and restoring over it would only spend time and disk.

      - name: Check the build tools
        run: |
          # The hosted image brings git and cmake; install whatever is missing with Homebrew.
          for p in cmake git; do command -v "$p" >/dev/null || brew install "$p"; done
          cmake --version | head -1

      # Pins the Node version the project uses in development, instead of whatever the
      # runner image has on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Web interface
        run: |
          npm ci
          npm run build
        working-directory: apps/frontend

      - name: Access to the engine repository (pom-plugin-llama.cpp)
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.POM_LLAMACPP_TOKEN }}
        run: |
          # Cargo.toml names the engine as ssh://git@github.com/...; this rewrites that URL to
          # HTTPS with a fine-grained token (read-only on pom-plugin-llama.cpp). It goes to the
          # job's global git config, which lives only as long as this hosted runner.
          git config --global url."https://x-access-token:${ENGINE_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      # One binary for Apple silicon and Intel: each slice is compiled for its own target
      # and lipo joins them. MACOSX_DEPLOYMENT_TARGET makes both slices run from macOS 11
      # (Big Sur) on, so Monterey and Big Sur get the same binary as the newer Macs.
      - name: "Compile (universal, arm64 and x86_64)"
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p node -p pom-plugin-host --features metal
          cargo build --release --locked --target x86_64-apple-darwin -p node -p pom-plugin-host --features metal
          mkdir -p target/universal/release
          for bin in pom pom-plugin-host; do
            lipo -create -output "target/universal/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
          done
          lipo -info target/universal/release/pom target/universal/release/pom-plugin-host

      # The installer window is laid out by create-dmg (Finder positions the icons), so the
      # DMG is built here, on the runner, and not on a developer machine.
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Assemble the package
        run: |
          nome="pom-${{ inputs.version }}-aarch64-apple-darwin"
          # The workspace persists between runs on this runner: clearing the leftovers from
          # the previous release avoids packaging the old package along with it.
          rm -rf pacote pom-*.dmg "$nome.dmg"

          # The app is the whole program: the binary, the plugin host (Contents/MacOS, where
          # the binary looks for it) and the interface (Contents/Resources/apps/frontend/dist,
          # found by `bundled_ui_dist`) all live inside the bundle.
          ./scripts/make-macos-app.sh target/universal/release/pom "pacote/POM.app"
          mkdir -p "pacote/POM.app/Contents/Resources/apps/frontend"
          cp -R apps/frontend/dist "pacote/POM.app/Contents/Resources/apps/frontend/"

          # The ad-hoc signature must be made last: the copies above change the sealed
          # resources. Signed before them, Gatekeeper reports the app as "damaged".
          codesign --force --deep --sign - "pacote/POM.app"
          codesign --verify --deep --strict "pacote/POM.app"

          # The disk image holds POM.app, an Applications shortcut and the README that
          # explains the first launch. make-dmg.sh lays out the window with create-dmg.
          packaging/macos/make-dmg.sh "pacote/POM.app" packaging/macos/README.txt "$nome.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-macos
          path: pom-*.dmg
          if-no-files-found: error
          # Only they pass between the jobs of this run; the release keeps the packages.
          retention-days: 2

      # Each system publishes its own package on the same tag: the first workflow
      # to run creates the release, the others attach their file.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: pom-*.dmg
