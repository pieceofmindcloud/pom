[package]
name = "node"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "pom"
path = "src/main.rs"

[features]
default = []
# As features do backend nativo vivem em `llama-engine`, que é quem declara
# `llama-cpp-sys-2`. Aqui só encaminham.
cuda = ["llama-engine/cuda"]
metal = ["llama-engine/metal"]
# Backend portatil: e o caminho das placas AMD, e tambem roda em NVIDIA e
# Intel. Pode ser combinado com `cuda` - o ggml carrega os dois backends e a
# escolha de qual usar e feita em tempo de execucao.
vulkan = ["llama-engine/vulkan"]

[dependencies]
# Todo o código llama.cpp (FFI, MTP, MoE, GGUF, sysmon) mora aqui, para que
# editar backend/rede/roteamento de `node` não o reconstrua.
llama-engine = { path = "../llama-engine" }
brand = { path = "../brand" }
enterprise-protocol = { path = "../enterprise-protocol" }
arc-swap = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
semver = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow.workspace = true
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-manual-roots"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
http = "1"
bytes = "1"
url = "2"
axum = "0.7"
# TLS entre peers: certificado auto assinado derivado da identidade do nó.
# Ver `network/tls.rs` para por que não há CA nem arquivo de certificado.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
x509-parser = "0.16"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { version = "0.5", features = ["util"] }
md-5 = "0.10"
memmap2 = "0.9"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
libp2p = { version = "0.56", features = [
    "tokio", "tcp", "dns", "noise", "yamux",
    "identify", "kad", "mdns", "gossipsub", "macros",
    "relay", "dcutr", "autonat", "request-response",
] }
pkarr = "6"
async-trait = "0.1"
subtle = "2"
mime_guess = "2"
tower-http = { version = "0.5", features = ["compression-full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
routing-contract = { path = "../routing-contract" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# COM/Win32 APIs used to offer the POM-owned firewall rules through UAC.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
# O shell nativo Windows usa WebView2 (runtime do sistema), sem Electron nem
# um segundo processo de navegador. Tao mantém a janela e o loop Win32; tray-icon
# instala o ícone e o menu na área de notificação.
image = { version = "0.25", default-features = false, features = ["png"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "0.25", default-features = false }
wry = { version = "0.57", default-features = false }

# Só compila `src/macos_status.m`, a ponte AppKit/WebKit do item de barra de
# status. Como o `winresource` acima, o `cfg` aqui é do host.
[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
