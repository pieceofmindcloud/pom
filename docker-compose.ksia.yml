x-node: &node
  build:
    context: "/home/jairpereira/workspace/rdma-p2p"
    args:
      POM_BUILD_COMMIT: "${POM_BUILD_COMMIT:-}"
      LLAMA_CPP_COMMIT: "${LLAMA_CPP_COMMIT:-unknown}"
  image: "pom:ksia"
  network_mode: host
  restart: unless-stopped
  environment:
      POM_HOME: /data
      POM_DEV: 1
      POM_UI_DIST: /app/apps/frontend/dist
services:
  node-1:
    <<: *node
    container_name: pom-gpu
    volumes:
      - "./tests/fixtures/node-gpu:/data"
      - /storage/nvme1/models_full:/storage/nvme1/models_full
      - /storage/nvme2/models_sliced:/storage/nvme2/models_sliced
      - /storage/hd1/models_full:/storage/hd1/models_full
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
