[workspace]
members = [
    "crates/brand",
    "crates/enterprise-protocol",
    "crates/enterprise-plugin-fixture",
    "crates/node",
    "crates/plugin-host",
    "crates/routing-base",
    "crates/routing-contract",
    "crates/types",
]
default-members = ["crates/node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# O motor llama.cpp (`llama-engine` e o binding `llama-cpp-sys-2`) mora no repositório
# pom-plugin-llama.cpp, fixado em um commit (`rev`). O patch substitui o llama-cpp-sys-2
# da crates.io pelo do mesmo repositório. O fonte do fork do llama.cpp vem de LLAMA_SOURCE
# (ver .cargo/config.toml).
[patch.crates-io]
llama-cpp-sys-2 = { git = "ssh://git@github.com/pieceofmindcloud/pom-plugin-llama.cpp.git", rev = "b503e388b0dc65cf81a9df6c7909d33f0be7217b" }
