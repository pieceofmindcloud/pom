# Salem hardware overlay: NVIDIA 3060 plus one Radeon.
# Set COMPOSE_FILE=docker-compose.yml:docker-compose.salem.yml when building
# or starting the cluster there. This file changes device visibility only.
services:
  node-gpu:
    devices: !override
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']

  node-gpu2:
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']

  node-gpu-3:
    devices: !override
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices: !override []
