name: Release · Linux

# It only runs when you ask for it, and it runs on the **self-hosted runner `ksia`** - it
# consumes no quota at all. If ksia is switched off the job waits in the queue instead of
# failing. See `docs/subsystems/build-and-run.md`, "Release through GitHub
# Actions".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.3.0)'
        required: true
        type: string
      cuda:
        description: 'Also build the CUDA variant (adds ~20 min of toolkit alone)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # A single job: on a self-hosted runner there is no minute multiplier, so
  # splitting the interface into another job would only add a round trip of
  # artifacts between two jobs that would run on the same machine anyway.
  build:
    name: Linux x86_64 (${{ matrix.variante.label }})
    runs-on: [self-hosted, Linux, X64, ksia]
    env:
      LLAMA_SOURCE: ${{ github.workspace }}/.ci-cache/llama.cpp
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CCACHE: sccache
    strategy:
      fail-fast: false
      matrix:
        # The CUDA variant only enters the matrix when it is asked for - the toolkit alone
        # takes ~20 min and almost every release is CPU only. Building the matrix with
        # `fromJSON` instead of skipping steps with `if:` is deliberate: in GitHub
        # Actions the **string** "false" is truthy, so an `if: matrix.algo`
        # fed by a boolean input always runs. Here the variant that was not
        # asked for simply does not exist.
        variante: ${{ fromJSON(inputs.cuda && '[{"label":"CPU","features":"","suffix":"cpu"},{"label":"CUDA","features":"cuda","suffix":"cuda"}]' || '[{"label":"CPU","features":"","suffix":"cpu"}]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare/cache the llama.cpp checkout
        id: llama-cache
        uses: ./.github/actions/llama-cache

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable the build cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # No `Swatinem/rust-cache`: it exists to hand a `target/` to a
      # runner that starts empty. Here the workspace persists between runs, the
      # `target/` is already there, and restoring over it would only spend time and disk -
      # which on this machine is exactly the scarce resource.

      # The toolkit is installed on ksia under /usr/local/cuda, but the runner's PATH does
      # not include it. Only the CUDA variant needs nvcc, so only it gets the directory.
      - name: Put the CUDA toolkit on PATH
        if: matrix.variante.features == 'cuda'
        shell: bash
        run: |
          if [ -x /usr/local/cuda/bin/nvcc ]; then
            echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          fi

      - name: Check the machine's dependencies
        run: |
          # On a self-hosted runner the dependencies are provisioned once on the
          # machine, not installed on every run: the runner runs as the user
          # `github-runner`, without sudo, on purpose. Failing here, naming what
          # is missing, is better than dying deep inside the llama.cpp build.
          #
          # `mold` is not optional: `.cargo/config.toml` forces `-fuse-ld=mold`
          # on Linux, so without it the link fails. `libclang` is for bindgen.
          faltou=""
          for p in cmake clang mold git; do
            command -v "$p" >/dev/null || faltou="$faltou $p"
          done
          [ -n "$(ldconfig -p 2>/dev/null | grep libclang)" ] || faltou="$faltou libclang-dev"
          if [ "${{ matrix.variante.features }}" = "cuda" ]; then
            command -v nvcc >/dev/null || faltou="$faltou nvcc(cuda-toolkit)"
          fi
          if [ -n "$faltou" ]; then
            echo "missing on ksia:$faltou" >&2
            echo "install as root: apt-get install -y cmake clang mold libclang-dev" >&2
            exit 1
          fi

      - name: Disk space
        run: |
          # A `target/` of this project measures ~9 GB, and ksia has already run short of
          # disk. Warning beforehand is better than breaking in the middle of the link.
          livre=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          echo "free: ${livre}G"
          [ "$livre" -ge 15 ] || echo "::warning::only ${livre}G free; a full build uses ~9G"

      # Pins Node instead of trusting what the machine has on PATH: the self-hosted
      # runner stores a snapshot of the PATH of whoever configured it, and ksia brings
      # Node 18. Here the version is the same one the project uses in development,
      # downloaded into the runner's tool cache.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Web interface
        run: |
          npm ci
          npm run build
        working-directory: apps/frontend

      - name: Access to the engine repository (pom-plugin-llama.cpp)
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.POM_LLAMACPP_TOKEN }}
        run: |
          # Cargo.toml names the engine as ssh://git@github.com/...; this rewrites that URL to
          # HTTPS with a fine-grained token (read-only on pom-plugin-llama.cpp). It is passed as
          # environment variables of the job, not written to ~/.gitconfig: this machine is
          # self-hosted, and the token must not outlive the job.
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${ENGINE_TOKEN}@github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=ssh://git@github.com/"
          } >> "$GITHUB_ENV"

      - name: Compile
        # `CUDAARCHS` empty on purpose, and not by oversight: without it the llama.cpp CMake
        # picks the wide list (compute_50 up to 121a), which is what a release needs - the
        # binary goes to machines that are not this one.
        #
        # The line exists because this job runs on a **self-hosted** runner: the
        # machine is a development one and may have `CUDAARCHS` in the environment to
        # shorten the local build (`pom-ksia.sh` does that). Inheriting that value
        # here would silently produce a release that only runs on the GPU of whoever
        # compiled. Clearing the variable is what prevents it.
        env:
          CUDAARCHS: ''
        run: |
          if [ -n "${{ matrix.variante.features }}" ]; then
            # sccache cannot wrap nvcc for the wide list of architectures (it fails with
            # "Missing cubin file output" on every CUDA compile test); nvcc runs directly.
            # C and C++ keep the cache.
            unset CMAKE_CUDA_COMPILER_LAUNCHER
            cargo build --release --locked -p node -p pom-plugin-host --features ${{ matrix.variante.features }}
          else
            cargo build --release --locked -p node -p pom-plugin-host
          fi

      # The binary sits at the package root with `apps/` beside it: `project_root()`
      # walks up from the executable's directory, so the package works unpacked
      # anywhere, with no `POM_HOME`.
      - name: Assemble the package
        run: |
          nome="pom-${{ inputs.version }}-x86_64-unknown-linux-gnu-${{ matrix.variante.suffix }}"
          # The workspace persists between runs on this runner: clearing the leftovers from
          # the previous release avoids packaging the old package along with it.
          rm -rf pacote pom-*.tar.gz "$nome"
          mkdir -p pacote/apps/frontend
          cp -R apps/frontend/dist pacote/apps/frontend/dist
          cp target/release/pom pacote/
          # Without the host beside the pom no plugin installs.
          cp target/release/pom-plugin-host pacote/
          cp README.md pacote/ 2>/dev/null || true
          # A Unix executable does not carry an icon: on Linux the one that shows it is the
          # .desktop pointing at the hicolor tree.
          mkdir -p pacote/share
          cp -R assets/brand/linux/hicolor pacote/share/
          cp assets/brand/pom.desktop pacote/share/
          mv pacote "$nome"
          tar czf "$nome.tar.gz" "$nome"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-linux-${{ matrix.variante.suffix }}
          path: pom-*.tar.gz
          if-no-files-found: error
          # Only they pass between the jobs of this run; the release keeps the packages.
          retention-days: 2

  # Each system publishes its own package on the same tag. The first workflow to
  # run creates the release, the others attach their file - that is what keeps the
  # three independent: running only the Linux one does not erase the macOS package that
  # was already there.
  release:
    name: Publish
    needs: build
    # Also on ksia: spending quota just to download two files and attach them to the
    # release would be the only billed minute of this workflow.
    runs-on: [self-hosted, Linux, X64, ksia]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pacote-linux-*
          merge-multiple: true
          path: pacotes
      - name: Check that something was produced
        run: |
          ls -la pacotes
          test -n "$(ls -A pacotes)" || { echo "no package was produced"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: pacotes/*
