name: Release · Windows

# It only runs when you ask for it. On a private repository the Windows runner minute
# counts 2x. See `docs/subsystems/build-and-run.md`, section "Release through GitHub
# Actions".
#
# Two variants, chosen in the `variantes` input:
#   gpu  CUDA 13.4 + Vulkan in the same pom.exe (ggml loads both backends),
#        with the llama.cpp from the release of the fork pieceofmindcloud/llama.cpp.
#        CUDA for NVIDIA; Vulkan covers NVIDIA, AMD (e.g. RX 7800 XT) and Intel.
#   cpu  CPU only, light package.
# If it fails, it fails alone - the Linux and macOS workflows do not depend on this one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.3.0)'
        required: true
        type: string
      variantes:
        description: 'Which packages to build'
        required: true
        default: gpu
        type: choice
        options: [gpu, cpu, ambos]
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: true
        type: boolean
      llama_tag:
        description: 'Release of the fork pieceofmindcloud/llama.cpp (empty = the newest one with the CUDA 13.4 + Vulkan package)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  # Where POM's own MoE kernels run; ggml-cuda.dll arrives ready from the fork. The same
  # list llama.cpp gives that DLL under CUDA 13, so the two cover the same cards. It has to
  # be written out: without it nvcc takes its one default target (see "GPU architectures").
  # 75 Turing, 80 A100, 86 Ampere, 89 Ada, 90 Hopper, 120/121 Blackwell; "virtual" is PTX,
  # compiled by the driver on first use, which also reaches later cards.
  POM_WINDOWS_CUDAARCHS: '75-virtual;80-virtual;86-real;89-real;90-virtual;120a-real;121a-real'
  # The same one as the fork's package (cuda-13.4) and the Docker image: the CUDA here
  # only compiles POM's own MoE kernels, and they have to match the
  # ggml-cuda.dll that arrives ready.
  CUDA_VERSION: '13.4.1'
  VULKAN_VERSION: '1.4.313.2'
  LLAMA_REPOSITORY: pieceofmindcloud/llama.cpp
  # The release the binary says it is; the update check compares it with the published ones.
  POM_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  # On `ubuntu-latest` on purpose: the interface is the same for the three systems
  # and the Linux minute counts 1x.
  ui:
    name: Web interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist-windows
          path: apps/frontend/dist
          if-no-files-found: error
          # Only they pass between the jobs of this run; the release keeps the packages.
          retention-days: 1

  build:
    name: Windows x86_64 (${{ matrix.variante }})
    needs: ui
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variante: ${{ fromJSON(inputs.variantes == 'ambos' && '["gpu","cpu"]' || format('["{0}"]', inputs.variantes)) }}
    env:
      # Ninja instead of the Visual Studio generator: CUDA with the VS generator needs
      # the MSBuild integration installed in Visual Studio; with Ninja the
      # nvcc and the cl.exe of the development environment are enough.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4

      # llama.cpp is not compiled here: it arrives ready from the fork's release, which is
      # already compiled (and tested) there. POM links the import libraries of the
      # package and takes the DLLs beside pom.exe; the source code of the same tag
      # is only for the headers (bindgen, mtmd and the MoE kernels).
      #   gpu  llama-<tag>-bin-win-cuda-13.4-vulkan-x64.zip (CUDA + Vulkan)
      #   cpu  llama-<tag>-bin-win-cpu-x64.zip
      - name: Download llama.cpp from the fork
        id: llama
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LLAMA_TAG: ${{ inputs.llama_tag }}
        run: |
          set -euo pipefail
          tag="$LLAMA_TAG"
          if [ -z "$tag" ]; then
            for candidate in $(gh release list -R "$LLAMA_REPOSITORY" -L 20 --json tagName -q '.[].tagName'); do
              if gh release view "$candidate" -R "$LLAMA_REPOSITORY" --json assets -q '.assets[].name' \
                  | grep -qx "llama-${candidate}-bin-win-cuda-13.4-vulkan-x64.zip"; then
                tag="$candidate"
                break
              fi
            done
          fi
          test -n "$tag" || { echo "no release of the fork has the CUDA 13.4 + Vulkan package" >&2; exit 1; }
          echo "fork release: $tag"
          if [ "${{ matrix.variante }}" = gpu ]; then
            package="llama-${tag}-bin-win-cuda-13.4-vulkan-x64.zip"
          else
            package="llama-${tag}-bin-win-cpu-x64.zip"
          fi
          # Unix path: with `D:\a\_temp` the Git Bash tar reads `D:` as
          # a remote host ("Cannot connect to D: resolve failed").
          root="$(cygpath -u "$RUNNER_TEMP")/llama"
          mkdir -p "$root/prebuilt" "$root/source"
          gh release download "$tag" -R "$LLAMA_REPOSITORY" -p "$package" -D "$root"
          unzip -q "$root/$package" -d "$root/prebuilt"
          if [ "${{ matrix.variante }}" = gpu ]; then
            gh release download "$tag" -R "$LLAMA_REPOSITORY" -p 'cudart-llama-bin-win-cuda-13.4-x64.zip' -D "$root"
            mkdir -p "$root/cudart"
            unzip -q "$root/cudart-llama-bin-win-cuda-13.4-x64.zip" -d "$root/cudart"
          fi
          curl -fsSL -o "$root/source.tar.gz" "https://github.com/$LLAMA_REPOSITORY/archive/refs/tags/$tag.tar.gz"
          tar --force-local -xzf "$root/source.tar.gz" --strip-components=1 -C "$root/source"
          for lib in llama ggml ggml-base llama-common; do
            test -f "$root/prebuilt/$lib.lib" || { echo "the package $package does not bring $lib.lib" >&2; exit 1; }
          done
          {
            echo "LLAMA_SOURCE=$(cygpath -w "$root/source")"
            echo "POM_LLAMA_CPP_PREBUILT_LIB_DIR=$(cygpath -w "$root/prebuilt")"
            echo "LLAMA_BUILD_SHARED_LIBS=1"
          } >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variante }}-llama-${{ steps.llama.outputs.tag }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Access to the engine repository (pom-plugin-llama.cpp)
        shell: bash
        env:
          ENGINE_TOKEN: ${{ secrets.POM_LLAMACPP_TOKEN }}
        run: |
          # Cargo.toml names the engine as ssh://git@github.com/...; this rewrites that URL to
          # HTTPS with a fine-grained token (read-only on pom-plugin-llama.cpp). It goes to the
          # job's global git config, which lives only as long as this hosted runner.
          git config --global url."https://x-access-token:${ENGINE_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Validate the autoclone destination on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          # llama-cpp-sys-2 comes from the pom-plugin-llama.cpp repository (a git dependency): the
          # test file is in the checkout cargo has just downloaded.
          $meta = cargo metadata --format-version 1 --locked | ConvertFrom-Json
          $sys = ($meta.packages | Where-Object { $_.name -eq 'llama-cpp-sys-2' }).manifest_path
          rustc --test (Join-Path (Split-Path -Parent $sys) 'src/build_support.rs') -o target/build-support-test.exe
          .\target\build-support-test.exe

      # bindgen looks for libclang on its own and, when it does not find it, the
      # error comes out as "unable to find libclang" in the middle of the
      # llama-cpp-sys build. The runner image brings LLVM; pointing at it explicitly
      # takes that variable out of the way.
      - name: Point libclang at bindgen
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      # cl.exe, lib.exe and the MSVC linker on PATH: nvcc needs cl.exe
      # as the host compiler and POM's MoE kernels are packaged with lib.exe.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Make sure ninja is there
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version

      # Only the components the build uses, straight from NVIDIA's "redist"
      # files (the full installer takes ~3 GB and many minutes). The version's
      # manifest gives the path of each component.
      - name: Install CUDA ${{ env.CUDA_VERSION }}
        if: matrix.variante == 'gpu'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $manifest = Invoke-RestMethod "$base/redistrib_$env:CUDA_VERSION.json"
          $cuda = 'C:\cuda'
          New-Item -ItemType Directory -Force $cuda | Out-Null
          # In CUDA 13 the CCCL became `cccl` and the NVVM (cicc, which nvcc calls)
          # left the nvcc package for `libnvvm`.
          $componentes = 'cuda_nvcc','libnvvm','cuda_cudart','cccl','cuda_nvrtc','cuda_nvtx',
                         'cuda_profiler_api','libcublas','visual_studio_integration','cuda_crt'
          foreach ($c in $componentes) {
            $item = $manifest.$c.'windows-x86_64'
            if (-not $item) { Write-Host "no $c in this version"; continue }
            $zip = Join-Path $env:RUNNER_TEMP "$c.zip"
            Write-Host "downloading $c $($manifest.$c.version)"
            curl.exe -fsSL -o $zip "$base/$($item.relative_path)"
            $tmp = Join-Path $env:RUNNER_TEMP $c
            Expand-Archive -Force $zip $tmp
            Get-ChildItem $tmp | ForEach-Object { Copy-Item -Recurse -Force "$($_.FullName)\*" $cuda }
          }
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$cuda"
          Add-Content $env:GITHUB_ENV "CUDACXX=$cuda\bin\nvcc.exe"
          Add-Content $env:GITHUB_PATH "$cuda\bin"
          & "$cuda\bin\nvcc.exe" --version

      - name: Install the Vulkan SDK ${{ env.VULKAN_VERSION }}
        if: matrix.variante == 'gpu'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & $exe --accept-licenses --default-answer --confirm-command install
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Lib\vulkan-1.lib")) { throw "Vulkan SDK did not install in $sdk" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"

      # pwsh, not bash: in Git Bash the MSYS /usr/bin/link.exe shows up before
      # the MSVC linker on PATH.
      # The web interface is compiled into pom.exe (feature `embed-ui`), so it has to be
      # on disk before the build. The `ui` job built it.
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist-windows
          path: apps/frontend/dist

      - name: Compile (${{ matrix.variante }})
        shell: pwsh
        run: |
          if ('${{ matrix.variante }}' -eq 'gpu') {
            $env:CUDAARCHS = $env:POM_WINDOWS_CUDAARCHS
            Remove-Item Env:CMAKE_CUDA_ARCHITECTURES -ErrorAction SilentlyContinue
            cargo build --release --locked -p node -p pom-plugin-host --features cuda,vulkan,embed-ui
          } else {
            cargo build --release --locked -p node -p pom-plugin-host --features embed-ui
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The interface is inside pom.exe, so there is no `apps/` folder in the package. The
      # state (pom.json, the database, models) is written beside pom.exe (`default_home`).
      # The icon already travels inside the .exe (`crates/node/build.rs`).
      #
      # `pom-plugin-host.exe` goes beside `pom.exe`: that is how pom
      # starts each plugin.
      #
      # On Windows the CUDA is linked dynamically (`llama-cpp-sys-2/build.rs`):
      # pom.exe needs cudart/cublas/cublasLt beside it, redistributable
      # under NVIDIA's licence; they come from the cudart package of the same fork release.
      # vulkan-1.dll comes with the video driver.
      - name: Assemble the package
        shell: bash
        run: |
          set -euo pipefail
          nome="pom-${{ inputs.version }}-x86_64-pc-windows-msvc"
          # The package folder is built from scratch: nothing else in the workspace goes in it.
          rm -rf pacote
          mkdir pacote
          llama="$(cygpath -u "$RUNNER_TEMP")/llama"
          # The llama.cpp DLLs from the fork's release: llama, ggml, the loadable
          # backends (ggml-cpu-*, and on the gpu ggml-cuda and ggml-vulkan) and
          # OpenMP. The *-impl.dll are of llama.cpp's tools, not of POM.
          for dll in "$llama"/prebuilt/*.dll; do
            case "$(basename "$dll")" in *-impl.dll) continue ;; esac
            cp "$dll" pacote/
          done
          if [ "${{ matrix.variante }}" = gpu ]; then
            nome="${nome}-cuda-vulkan"
            for dll in cudart64_ cublas64_ cublasLt64_; do
              ls "$llama"/cudart/${dll}*.dll >/dev/null
              cp "$llama"/cudart/${dll}*.dll pacote/
            done
            ls pacote/ggml-cuda.dll pacote/ggml-vulkan.dll >/dev/null
          fi
          cp target/release/pom.exe pacote/
          # Without the host beside pom.exe no plugin installs
          # (`plugin_host::host_executable`).
          cp target/release/pom-plugin-host.exe pacote/
          # The install guide for this package (SmartScreen, firewall, data folder).
          cp packaging/windows/README.md pacote/README.md
          # POM's license and the third-party notices (NVIDIA's terms for the CUDA DLLs included).
          cp LICENSE THIRD-PARTY-NOTICES.txt pacote/
          mv pacote "$nome"
          7z a -tzip "$nome.zip" "$nome"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-windows-${{ matrix.variante }}
          path: pom-*.zip
          if-no-files-found: error
          # Only they pass between the jobs of this run; the release keeps the packages.
          retention-days: 1

  # Each system publishes its own package on the same tag: the first workflow to
  # run creates the release, the others attach their file.
  release:
    name: Publish
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pacote-windows-*
          merge-multiple: true
          path: pacotes
      - name: Check the packages
        run: ls -la pacotes && test -n "$(ls pacotes)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: pacotes/*
