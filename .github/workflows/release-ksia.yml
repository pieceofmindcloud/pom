name: Release · ksia (Linux + CUDA, Windows)

# It only runs when you ask for it, and **every job runs on the self-hosted runner
# `ksia`**: not a minute nor a byte of GitHub storage. There is no `upload-artifact`
# and no `actions/cache`: each job builds, packages and attaches its own package to the
# release straight from ksia, and what has to persist between runs (the llama.cpp
# checkout, the `target/` per variant, cargo-xwin and the Windows SDK) lives in
# `~/.cache/pom-release` on the machine. The build of each variant is in
# `scripts/release-ksia.sh`; see `docs/subsystems/build-and-run.md`,
# "Release on the self-hosted Linux runner (`release-ksia.yml`)".
#
# The workflows `release-linux.yml`, `release-macos.yml` and `release-windows.yml`
# still exist; this one is the alternative that uses no GitHub quota.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.3.0)'
        required: true
        type: string
      linux_cpu:
        description: 'Linux x86_64 CPU'
        required: false
        default: true
        type: boolean
      linux_cuda:
        description: 'Linux x86_64 CUDA (all CUDA 12.9 architectures; takes hours)'
        required: false
        default: true
        type: boolean
      windows_cpu:
        description: 'Windows x86_64 CPU (cross-compiled on ksia)'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# One release at a time: the jobs share the same machine and the same directories.
concurrency:
  group: release-ksia
  cancel-in-progress: false

jobs:
  linux-cpu:
    name: Linux x86_64 (CPU)
    if: inputs.linux_cpu
    runs-on: [self-hosted, Linux, X64, ksia]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm`: that cache lives on GitHub.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Disk space
        run: |
          livre=$(df -BG --output=avail "$HOME" | tail -1 | tr -dc '0-9')
          echo "free in \$HOME: ${livre}G"
          [ "$livre" -ge 20 ] || echo "::warning::only ${livre}G free; each variant uses ~10G in ~/.cache/pom-release"

      - name: Build and package
        # Cargo.toml names the engine (pom-plugin-llama.cpp) as ssh://git@github.com/...;
        # the same fine-grained read-only token the hosted workflows use rewrites that URL
        # to HTTPS. Through GIT_CONFIG_* it lives only in this step's environment, never
        # in the self-hosted runner's ~/.gitconfig.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.POM_LLAMACPP_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: scripts/release-ksia.sh --variant linux-cpu --version "${{ inputs.version }}"
      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: dist-release-ksia/pom-${{ inputs.version }}-x86_64-unknown-linux-gnu-cpu.tar.gz

  linux-cuda:
    name: Linux x86_64 (CUDA, all architectures)
    if: inputs.linux_cuda
    runs-on: [self-hosted, Linux, X64, ksia]
    # Compiling the llama.cpp kernels for the whole list of GPUs takes hours.
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Disk space
        run: |
          livre=$(df -BG --output=avail "$HOME" | tail -1 | tr -dc '0-9')
          echo "free in \$HOME: ${livre}G"
          [ "$livre" -ge 25 ] || echo "::warning::only ${livre}G free; the full CUDA build uses well more than the CPU one"

      - name: Build and package
        # Cargo.toml names the engine (pom-plugin-llama.cpp) as ssh://git@github.com/...;
        # the same fine-grained read-only token the hosted workflows use rewrites that URL
        # to HTTPS. Through GIT_CONFIG_* it lives only in this step's environment, never
        # in the self-hosted runner's ~/.gitconfig.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.POM_LLAMACPP_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: scripts/release-ksia.sh --variant linux-cuda --version "${{ inputs.version }}"
      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: dist-release-ksia/pom-${{ inputs.version }}-x86_64-unknown-linux-gnu-cuda.tar.gz

  windows-cpu:
    name: Windows x86_64 (CPU, cross-compiled)
    if: inputs.windows_cpu
    runs-on: [self-hosted, Linux, X64, ksia]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Build and package
        # Cargo.toml names the engine (pom-plugin-llama.cpp) as ssh://git@github.com/...;
        # the same fine-grained read-only token the hosted workflows use rewrites that URL
        # to HTTPS. Through GIT_CONFIG_* it lives only in this step's environment, never
        # in the self-hosted runner's ~/.gitconfig.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.POM_LLAMACPP_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
        run: scripts/release-ksia.sh --variant windows-cpu --version "${{ inputs.version }}"
      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: dist-release-ksia/pom-${{ inputs.version }}-x86_64-pc-windows-msvc.zip
