# 3-node local dev/test cluster.
#
# Host networking is required, same as the manual `docker run --net host`
# this replaces: P2P discovery broadcasts to 255.255.255.255:42777 and the
# gateway/inference ports are only reachable that way. Because every node
# shares the host's network namespace, each one's rdma-p2p.json must pick its
# own gateway_port/p2p_port/inference_port so they don't collide (see
# old/scripts/run-p1.sh + run-p2.sh for the same pattern on bare metal).
#
# Each node's state — rdma-p2p.json, .rdma-p2p-node.key, models/ — lives under
# its own directory in ./tests/fixtures (RDMA_P2P_HOME below), gitignored so
# generated keys and models never land in the repo. A node with nothing in
# its directory yet just boots into setup mode
# (https://<host>:<gateway_port>/) same as on bare metal. RDMA_P2P_UI_DIST is
# pinned to the path baked into the image because RDMA_P2P_HOME no longer
# points at /app, and the web interface would otherwise be looked for under
# the (bind-mounted, UI-less) data directory instead.
x-node: &node
  build: .
  image: pom:latest
  network_mode: host
  environment:
    RDMA_P2P_HOME: /data
    RDMA_P2P_UI_DIST: /app/apps/frontend/dist

# Cada no precisa da sua propria porta de gateway ANTES de existir um
# rdma-p2p.json: com o diretorio de dados vazio o no sobe em modo setup, que
# usa o --gateway-port da linha de comando. Sem isto os tres pedem a 8080 e
# dois morrem com "Address already in use", que e o que acontecia num checkout
# limpo. A 8080 fica de fora de proposito: na ksia ela e do code-server.
# As portas P2P e de inferencia sao escolhidas depois, na tela de setup, e
# tambem precisam ser distintas entre os tres.
services:
  node-gpu:
    <<: *node
    container_name: rdma-p2p-node-gpu
    command: ["--gateway-port", "8101"]
    volumes:
      - ./tests/fixtures/node-gpu:/data
      - ./models:/data/models
    # Equivalent of `docker run --gpus all`. Requires the NVIDIA Container
    # Toolkit on the host; omitted entirely on the other two nodes.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  node-cpu-1:
    <<: *node
    container_name: rdma-p2p-node-cpu-1
    command: ["--gateway-port", "8102"]
    volumes:
      - ./tests/fixtures/node-cpu-1:/data
      - ./models:/data/models

  node-cpu-2:
    <<: *node
    container_name: rdma-p2p-node-cpu-2
    command: ["--gateway-port", "8103"]
    volumes:
      - ./tests/fixtures/node-cpu-2:/data
      - ./models:/data/models
