[package]
name = "node"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "pom"
path = "src/main.rs"

# Fake IPC host, used only by the lifecycle regression tests,
# the POM_PLUGIN_DB path and the handshake in `src/plugins.rs`. It is not part of the product.
[[bin]]
name = "pom-fake-enterprise-plugin-host"
path = "tests/support/fake_plugin_host.rs"

[features]
default = []
# The native backend features live in `llama-engine` (the pom-plugin-llama.cpp repository),
# which is the one declaring `llama-cpp-sys-2`. Here they only forward.
cuda = ["llama-engine/cuda"]
metal = ["llama-engine/metal"]
# Portable backend: it is the path for AMD cards, and it also runs on NVIDIA and
# Intel. It can be combined with `cuda` - ggml loads both backends and the
# choice of which one to use is made at runtime.
vulkan = ["llama-engine/vulkan"]
# The web interface compiled into the executable (`include_dir`), so the release is a
# single pom.exe with no `apps/frontend/dist` folder beside it. Needs the bundle built
# before `cargo build` (`apps/frontend`: `npm run build`). Off by default: development
# keeps reading the bundle from disk, so editing the interface needs no rebuild.
embed-ui = ["dep:include_dir"]
# The Linux window: the web interface in a native WebKitGTK view, the same screen the macOS
# and Windows shells open. It needs the GTK 3 and WebKitGTK 4.1 development packages to
# build, and WebKitGTK at run time. Off by default, so a Linux server or a Docker image
# builds without any graphical library.
desktop = ["dep:tao", "dep:wry", "dep:webkit2gtk"]

[dependencies]
# All the llama.cpp code (FFI, MTP, MoE, GGUF, sysmon) lives here, so that
# editing the backend/network/routing of `node` does not rebuild it.
llama-engine = { git = "ssh://git@github.com/pieceofmindcloud/pom-plugin-llama.cpp.git", rev = "0d9bdbffd6c405150e7c41cd002ceba9858a32ca" }
brand = { path = "../brand" }
enterprise-protocol = { path = "../enterprise-protocol" }
arc-swap = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
clap = { version = "4", features = ["derive", "env", "string"] }
serde.workspace = true
serde_json.workspace = true
semver = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow.workspace = true
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-manual-roots"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
http = "1"
bytes = "1"
url = "2"
axum = "0.7"
# TLS between peers: a self-signed certificate derived from the node's identity.
# See `network/tls.rs` for why there is no CA and no certificate file.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
x509-parser = "0.16"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
tower = { version = "0.5", features = ["util"] }
md-5 = "0.10"
# Decodes the embedded city database (`utils/geo.rs`).
flate2 = "1"
memmap2 = "0.9"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "compat"] }
# Peer-to-peer transport: QUIC endpoints dialed by Ed25519 key, relays with
# hole punching, gossip and LAN discovery. See `network/p2p.rs`.
iroh = { version = "1.3", features = ["unstable-net-report"] }
iroh-gossip = "0.101"
iroh-mdns-address-lookup = "0.6"
iroh-relay = { version = "1.3", features = ["server"] }
pkarr = "8.1"
async-trait = "0.1"
subtle = "2"
mime_guess = "2"
include_dir = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["compression-full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
routing-contract = { path = "../routing-contract" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# COM/Win32 APIs used to offer the POM-owned firewall rules through UAC.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The native Windows shell uses WebView2 (a system runtime), without Electron nor
# a second browser process. Tao keeps the window and the Win32 loop; tray-icon
# installs the icon and the menu in the notification area.
image = { version = "0.25", default-features = false, features = ["png"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "0.25", default-features = false }
wry = { version = "0.57", default-features = false }
# The WebView2 interfaces wry does not wrap: the server certificate error event
# (`windows_status.rs`). Same version wry builds on.
webview2-com = "0.39"

# It only compiles `src/macos_status.m`, the AppKit/WebKit bridge of the status bar
# item. Like the `winresource` above, the `cfg` here is the host's.
# The Linux window (feature `desktop`). Same crates as the Windows shell, with WebKitGTK
# in place of WebView2. Optional: they are compiled only with the feature.
[target.'cfg(target_os = "linux")'.dependencies]
# The defaults turn on the GTK backend (`os-webview`) and X11 for wry, and X11 and Wayland for
# tao: without `os-webview` wry has no WebKitGTK to build on.
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
# The view's TLS failure signal and certificate exception (`linux_window.rs`), from
# the same WebKitGTK bindings wry builds on.
webkit2gtk = { version = "2.0", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
# Local DHT testnet for the pkarr round trip (`pkarr_node.rs` tests); the
# version pkarr itself uses.
mainline = "8"
