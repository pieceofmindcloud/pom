# Relay-only node: a POM node on a public address that serves no model and is
# not a participant of your network. It only helps nodes behind NAT reach each
# other: it runs an iroh relay server, nodes connect to each other through it,
# and iroh upgrades the connection to a direct one by hole punching when the
# NATs allow it. Traffic stays relayed when they don't. n0's public relays do
# the same job out of the box; a relay of your own keeps the traffic metadata
# off third-party infrastructure.
#
# ── Image ────────────────────────────────────────────────────────────────────
# Build it from the repository root with scripts/build-docker.sh, which tags
# `pom:latest`. The relay needs no GPU; the same image runs on a CPU-only host.
#
# ── First start ──────────────────────────────────────────────────────────────
# With no pom.json in ./data the node starts on a local network of its own. Open http://<relay-public-ip>:8080/ once and create a standalone
# network with its own connection key, NOT your cluster's key: the relay must
# not show up as a participant of your network. Deploy no model on it.
#
# ── Ports (open them in the host/cloud firewall) ─────────────────────────────
# With the default P2P port 42777:
#   42777/udp  UDP discovery
#   52777/tcp  relay server, plain HTTP (P2P port + 10000)
#   52777/udp  the node's own iroh endpoint (P2P port + 10000)
#   8080/tcp   web UI - only needed for the first setup; close it afterwards
#              or restrict it to your own address.
# If you change p2p_port in the relay's pom.json, shift all three accordingly.
#
# ── The NAT'd nodes (admin and the others) ───────────────────────────────────
# Point them at this relay by its URL: `http://<relay-public-ip>:52777`, or,
# better, a DNS name for it behind a TLS proxy (`https://relay.example.org`).
# Put it in `relay_peers` in the admin's pom.json (or `--relay-peers <url>`).
# Only a URL with a host name goes into the trust document as a relay hint (a
# signed document never carries an IP), and every node that joins copies the
# hints into its own relay_peers. A relay configured this way is a dedicated,
# public one: it bridges
# control and inference between nodes behind NAT, and never a file transfer.
# Files only cross relays that are members of the cluster itself.
# advertise_addr is a hint that goes first, never the only address announced.
#
# Usage:
#   RELAY_PUBLIC_IP=203.0.113.10 docker compose up -d
# An IPv6 relay needs the brackets, or the port cannot be told apart:
#   RELAY_PUBLIC_IP='[2001:db8::10]' docker compose up -d
services:
  relay:
    image: pom:latest
    container_name: pom-relay
    # Host networking keeps the observed and announced addresses equal to the
    # host's, which is what the NAT'd nodes must dial. With a bridge network,
    # replace it with the `ports:` block below.
    network_mode: host
    # ports:
    #   - "42777:42777/udp"
    #   - "52777:52777/tcp"
    #   - "52777:52777/udp"
    #   - "8080:8080/tcp"
    restart: unless-stopped
    command:
      - --serve-relay
      # HOST:PORT, where PORT is the UDP P2P port; the endpoint and the relay
      # server use PORT + 10000.
      - --public-addr
      - ${RELAY_PUBLIC_IP:?set RELAY_PUBLIC_IP to this host's public address}:42777
    environment:
      POM_HOME: /data
      POM_UI_DIST: /app/apps/frontend/dist
      POM_PLUGIN_HOST: /usr/local/bin/pom-plugin-host
      POM_BIN: /usr/local/bin/pom
    volumes:
      # pom.json and the node identity key (.pom-node.key) live here. Keep
      # this directory: the key is the relay's identity (endpoint id and pk:
      # address).
      - ./data:/data
