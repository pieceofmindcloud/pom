# bindgen needs to find stdbool.h when generating llama-cpp-sys-2 bindings.
# Ubuntu ships clang without its bundled C headers; point bindgen at GCC's copy
# instead. On macOS, Apple Clang has complete headers so this is harmless.
# Git dependencies (pom-plugin-llama.cpp, a private repository over SSH) are fetched by the
# system `git` client, which uses the same keys and credentials as the operator's git.
[net]
git-fetch-with-cli = true

[env]
BINDGEN_EXTRA_CLANG_ARGS = { value = "-I/usr/lib/gcc/x86_64-linux-gnu/13/include", force = false }
# Source of the llama.cpp fork used by the llama-cpp-sys-2 binding (it comes from the
# pom-plugin-llama.cpp repository). Relative to this root: the `llama.cpp` at the POM root (a checkout
# or a symlink of the fork). An LLAMA_SOURCE already set in the environment (CI, Docker) prevails.
LLAMA_SOURCE = { value = "llama.cpp", relative = true, force = false }

# This profile applies to the *Rust* code. llama.cpp comes from cmake with
# `--config Release` and has always been optimized - what was at opt-level 0 was
# our side: sampler, wire.rs (f16, zstd), HTTP.
#
# Measured in the sampler with the Qwen3 vocabulary (151,936 tokens), same code:
#
#   opt-level = 0   7.77 ms/token
#   opt-level = 3   0.26 ms/token      (30x)
#
# `incremental = true` for low build times day to day: `lto = "fat"`
# already does an optimized link, and incremental rebuilds save more than the
# eventual cross-crate inlining that disabling incremental used to bring. Measured 30x
# from opt-level 0 to 3 in the sampler; setting it back to false is one line if the build
# cost in CI becomes a nuisance.
[profile.release]
opt-level = 3          # Maximize CPU execution speed and loop vectorization
lto = "fat"            # Enable heavy Link-Time Optimization across crates
codegen-units = 1
debug = 0              # Reduce debug info levels (e.g., line numbers only) to speed up builds
incremental = true

[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
