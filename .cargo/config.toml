# bindgen needs to find stdbool.h when generating llama-cpp-sys-2 bindings.
# Ubuntu ships clang without its bundled C headers; point bindgen at GCC's copy
# instead. On macOS, Apple Clang has complete headers so this is harmless.
# Dependências git (pom-plugin-llama.cpp, repositório privado por SSH) são buscadas pelo
# cliente `git` do sistema, que usa as mesmas chaves e credenciais que o git do operador.
[net]
git-fetch-with-cli = true

[env]
BINDGEN_EXTRA_CLANG_ARGS = { value = "-I/usr/lib/gcc/x86_64-linux-gnu/13/include", force = false }
# Fonte do fork do llama.cpp usado pelo binding llama-cpp-sys-2 (vem do repositório
# pom-plugin-llama.cpp). Relativo a esta raiz: o `llama.cpp` da raiz do POM (checkout
# ou symlink do fork). Um LLAMA_SOURCE já definido no ambiente (CI, Docker) prevalece.
LLAMA_SOURCE = { value = "llama.cpp", relative = true, force = false }

# Este perfil vale para o codigo *Rust*. O llama.cpp vem do cmake com
# `--config Release` e sempre esteve otimizado - o que estava em opt-level 0 era
# o nosso lado: sampler, wire.rs (f16, zstd), HTTP.
#
# Medido no sampler com o vocabulario do Qwen3 (151.936 tokens), mesmo codigo:
#
#   opt-level = 0   7,77 ms/token
#   opt-level = 3   0,26 ms/token      (30x)
#
# `incremental = true` para tempos de build baixos no dia a dia: `lto = "fat"`
# ja faz link otimizado, e recompilacoes incrementais economizam mais do que o
# eventual inline cross-crate que o incremental desabilitado trazia. Medido 30x
# de opt-level 0 para 3 no sampler; voltar a false e uma linha se o custo de
# build no CI incomodar.
[profile.release]
opt-level = 3          # Maximize CPU execution speed and loop vectorization
lto = "fat"            # Enable heavy Link-Time Optimization across crates
codegen-units = 1
debug = 0              # Reduce debug info levels (e.g., line numbers only) to speed up builds
incremental = true

[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
