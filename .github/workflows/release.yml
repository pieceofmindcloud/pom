name: Release

# Só roda quando você mandar. Nada dispara sozinho em push ou pull request:
# um build completo custa mais de uma hora de runner por causa do llama.cpp
# nativo, e a variante CUDA sozinha leva ~20 min só instalando o toolkit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Publicar como prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # A interface é lida do disco em tempo de execução (config::ui_dist_dir), não
  # embutida no binário. Sem este job os pacotes sobem e respondem 500 na tela.
  # Buildada uma vez só: o dist é o mesmo para os três sistemas.
  ui:
    name: Interface web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/frontend/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    needs: ui
    runs-on: ${{ matrix.os }}
    # Um alvo que quebra não leva os outros junto: o pacote de Windows é o mais
    # novo do conjunto e é o primeiro candidato a falhar sozinho.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64 (Metal)
            os: macos-14
            target: aarch64-apple-darwin
            features: metal
            experimental: false
          - label: Linux x86_64 (CPU)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: ''
            experimental: false
          - label: Linux x86_64 (CUDA)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: cuda
            experimental: false
          - label: Windows x86_64 (CPU)
            os: windows-2022
            target: x86_64-pc-windows-msvc
            features: ''
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Sem a chave, CPU e CUDA do mesmo runner compartilhariam cache e um
          # sobrescreveria os artefatos nativos do outro.
          key: ${{ matrix.label }}

      # O bindgen do llama-cpp-sys precisa dos headers do clang. Já mordeu esta
      # árvore antes, na ksia.
      - name: Dependências de build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev clang

      # O toolkit do apt do Ubuntu é velho demais para GPUs recentes; este é o
      # repositório oficial da NVIDIA, mesma decisão tomada à mão na ksia.
      - name: CUDA toolkit
        if: matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.2'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas-dev"]'

      - name: Compilar
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }} --features ${{ matrix.features }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: pacote/apps/frontend/dist

      # O binário fica na raiz do pacote com apps/ ao lado: config::project_root
      # sobe a partir do diretório do executável, então o pacote funciona
      # descompactado em qualquer lugar, sem RDMA_P2P_HOME.
      - name: Montar o pacote
        shell: bash
        run: |
          nome="rdma-p2p-${{ inputs.version }}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/rdma-p2p.exe" pacote/
          else
            cp "target/${{ matrix.target }}/release/rdma-p2p" pacote/
          fi
          cp README.md pacote/ 2>/dev/null || true
          mv pacote "$nome"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$nome.zip" "$nome"
          else
            tar czf "$nome.tar.gz" "$nome"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.target }}-${{ matrix.features || 'cpu' }}
          path: |
            rdma-p2p-*.tar.gz
            rdma-p2p-*.zip
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    # Publica com o que conseguiu compilar: um alvo experimental que falhou não
    # deve impedir a entrega dos outros três.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pacote-*
          merge-multiple: true
          path: pacotes

      - name: Conferir que sobrou alguma coisa
        run: |
          ls -la pacotes
          test -n "$(ls -A pacotes)" || { echo "nenhum pacote foi produzido"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: pacotes/*
          body: |
            Descompacte e rode o binário de dentro da pasta: a interface web é
            lida do disco em `apps/frontend/dist`, que já vai no pacote.

            | pacote | observação |
            |---|---|
            | `aarch64-apple-darwin` | macOS Apple Silicon, com Metal |
            | `x86_64-unknown-linux-gnu` (cpu) | Linux, inferência em CPU |
            | `x86_64-unknown-linux-gnu` (cuda) | Linux com GPU NVIDIA, CUDA 12.6 |
            | `x86_64-pc-windows-msvc` | Windows, inferência em CPU. Alvo novo, sem GPU |
