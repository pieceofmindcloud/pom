<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="%BRAND_FAVICON%" sizes="any" />
    <link rel="icon" type="image/png" href="%BRAND_ICON%" />
    <link rel="apple-touch-icon" href="%BRAND_APPLE_ICON%" />
    <title>%BRAND_NAME% · %BRAND_TAGLINE%</title>
      <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          // Dark is the product's default; light is something the operator
          // chooses. The system preference does not get to decide, or a
          // daytime laptop would open the console in a theme nobody picked.
          var saved = localStorage.getItem("%BRAND_SLUG%.theme");
          document.documentElement.dataset.theme =
            saved === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("%BRAND_SLUG%.locale");
          var locales = navigator.languages || [navigator.language];
          var locale = saved === "en" || saved === "pt-BR" ? saved : "en";
          if (saved !== "en" && saved !== "pt-BR") {
            for (var i = 0; i < locales.length; i++) {
              var hint = String(locales[i] || "").toLowerCase();
              if (hint === "pt" || hint.indexOf("pt-") === 0) {
                locale = "pt-BR";
                break;
              }
              if (hint === "en" || hint.indexOf("en-") === 0) break;
            }
          }
          document.documentElement.lang = locale;
        } catch (e) {
          document.documentElement.lang = "en";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
