name: Release · Windows

# Só roda quando você mandar. Em repositório privado o minuto de runner Windows
# conta 2x. Ver `docs/subsystems/build-execucao.md`, seção "Release pelo GitHub
# Actions".
#
# **Alvo novo.** Windows é o menos exercitado dos três: nunca foi compilado
# neste repositório, e a inferência é só em CPU. Se falhar, falha sozinho - os
# workflows de Linux e macOS não dependem deste.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Publicar como prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # Em `ubuntu-latest` de propósito: a interface é a mesma para os três sistemas
  # e o minuto de Linux conta 1x.
  ui:
    name: Interface web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist-windows
          path: apps/frontend/dist
          if-no-files-found: error

  build:
    name: Windows x86_64 (CPU)
    needs: ui
    runs-on: windows-2022
    env:
      LLAMA_SOURCE: ${{ github.workspace }}/.ci-cache/llama.cpp
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CCACHE: sccache
      # Temporário para a reprodução do crash no Windows. Cargo grava símbolos
      # Rust e C++ gravam CodeView nos objetos; /DEBUG:FULL faz o linker
      # preservar os símbolos no pom.pdb que vai para o ZIP. /Z7 evita que os
      # compiladores paralelos disputem um único vc140.pdb no runner.
      CARGO_PROFILE_RELEASE_DEBUG: "2"
      # O profile release normal usa lto=fat e codegen-units=1. Com símbolos
      # completos isso estoura a memória do linker no runner Windows padrão;
      # este build é diagnóstico e pode sacrificar otimização por estabilidade.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUSTFLAGS: "-C link-arg=/DEBUG:FULL"
      CFLAGS: /Z7
      CXXFLAGS: /Z7
      CMAKE_C_FLAGS: /Z7
      CMAKE_CXX_FLAGS: /Z7
    steps:
      - uses: actions/checkout@v4

      - name: Preparar/cachear checkout do llama.cpp
        id: llama-cache
        uses: ./.github/actions/llama-cache

      - uses: dtolnay/rust-toolchain@stable

      - name: Ativar cache de compilação
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          key: llama-${{ steps.llama-cache.outputs.sha }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Validar destino do autoclone no Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --test vendor/llama-cpp-sys-2/src/build_support.rs -o target/build-support-test.exe
          .\target\build-support-test.exe

      # O bindgen procura a libclang por conta própria e, quando não acha, o
      # erro sai como "unable to find libclang" no meio do build do
      # llama-cpp-sys. A imagem do runner traz o LLVM; apontar explicitamente
      # tira essa variável do caminho.
      - name: Apontar a libclang para o bindgen
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Compilar com símbolos de debug temporários
        run: cargo build --release --locked

      - name: Verificar PDB correspondente ao binário
        shell: pwsh
        run: |
          $pdb = "target/release/pom.pdb"
          if (-not (Test-Path $pdb)) {
            throw "O build Windows não gerou $pdb"
          }
          Get-Item target/release/pom.exe, $pdb | Select-Object FullName, Length, LastWriteTime

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist-windows
          path: pacote/apps/frontend/dist

      # O binário fica na raiz do pacote com `apps/` ao lado: `project_root()`
      # sobe a partir do diretório do executável, então a pasta descompactada
      # funciona em qualquer lugar, sem `POM_HOME`. O ícone já viaja dentro do
      # .exe (`crates/node/build.rs`), então aqui não há nada a copiar.
      - name: Montar o pacote
        shell: bash
        run: |
          nome="pom-${{ inputs.version }}-x86_64-pc-windows-msvc"
          cp target/release/pom.exe pacote/
          cp target/release/pom.pdb pacote/
          cp README.md pacote/ 2>/dev/null || true
          mv pacote "$nome"
          7z a -tzip "$nome.zip" "$nome"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-windows
          path: pom-*.zip
          if-no-files-found: error

  # Cada sistema publica o próprio pacote na mesma tag: o primeiro workflow a
  # rodar cria a release, os outros anexam o arquivo deles.
  release:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pacote-windows
          path: pacotes
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: pacotes/*
