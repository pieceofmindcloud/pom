[workspace]
members = [
    "crates/brand",
    "crates/enterprise-protocol",
    "crates/enterprise-plugin-fixture",
    "crates/metering-core",
    "crates/node",
    "crates/plugin-host",
    "crates/routing-base",
    "crates/routing-contract",
    "crates/types",
]
default-members = ["crates/node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The llama.cpp engine (`llama-engine` and the `llama-cpp-sys-2` binding) lives in the
# pom-plugin-llama.cpp repository, pinned to a commit (`rev`). The patch replaces the llama-cpp-sys-2
# from crates.io with the one from that same repository. The source of the llama.cpp fork comes from LLAMA_SOURCE
# (see .cargo/config.toml).
[patch.crates-io]
llama-cpp-sys-2 = { git = "ssh://git@github.com/pieceofmindcloud/pom-plugin-llama.cpp.git", rev = "eae9334fe659895cfb1f7f71f7d98b4182ed19a9" }
