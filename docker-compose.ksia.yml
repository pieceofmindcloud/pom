x-node: &node
  build:
    context: "/storage/nvme1/projects/pom"
    target: runtime
    additional_contexts:
      llama-fork: "${POM_LLAMA_CPP_SOURCE_CONTEXT:-./llama.cpp}"
    args:
      POM_BUILD_COMMIT: "${POM_BUILD_COMMIT:-}"
      LLAMA_CPP_CACHE_KEY: "${LLAMA_CPP_CACHE_KEY:-unknown}"
      POM_LLAMA_CPP_MODE: "${POM_LLAMA_CPP_MODE:-release}"
      POM_LLAMA_CPP_RELEASE_TAG: "${POM_LLAMA_CPP_RELEASE_TAG:-}"
      POM_LLAMA_CPP_RELEASE_REPOSITORY: "${POM_LLAMA_CPP_RELEASE_REPOSITORY:-pereirajair/llama.cpp}"
      CUDA_RUNTIME_FLAVOR: "${CUDA_RUNTIME_FLAVOR:-runtime}"
      POM_CUDA_ARCHITECTURES: "${POM_CUDA_ARCHITECTURES:-86;120}"
      POM_CUDA_ARCH_CACHE_KEY: "${POM_CUDA_ARCH_CACHE_KEY:-86-120}"
      RUST_TOOLCHAIN: "${RUST_TOOLCHAIN:-stable}"
  image: "pom:ksia"
  network_mode: host
  restart: unless-stopped
  environment:
      POM_HOME: /data
      POM_DEV: 1
      POM_UI_DIST: /app/apps/frontend/dist
services:
  node-1:
    <<: *node
    container_name: pom-gpu
    volumes:
      - "./tests/fixtures/node-gpu:/data"
      # Stable persistent root shared by user projects and plugin data.
      - "${POM_WORKSPACE_DIR:-/storage/pom-workspace}:/data/workspace"
      - /storage/nvme1/models_full:/storage/nvme1/models_full
      - /storage/nvme2/models_sliced:/storage/nvme2/models_sliced
      - /storage/hd1/models_full:/storage/hd1/models_full
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
