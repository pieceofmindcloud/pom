# 3-node local dev/test cluster.
#
# Host networking is required, same as the manual `docker run --net host`
# this replaces: P2P discovery broadcasts to 255.255.255.255:42777 and the
# gateway/inference ports are only reachable that way. Because every node
# shares the host's network namespace, each one's pom.json must pick its
# own gateway_port/p2p_port/inference_port so they don't collide (see
# old/scripts/run-p1.sh + run-p2.sh for the same pattern on bare metal).
#
# Each node's state — pom.json, .pom-node.key, models/ — lives under
# its own directory in ./tests/fixtures (POM_HOME below), gitignored so
# generated keys and models never land in the repo. A node with nothing in
# its directory yet just boots into setup mode
# (https://<host>:<gateway_port>/) same as on bare metal. POM_UI_DIST is
# pinned to the path baked into the image because POM_HOME no longer
# points at /app, and the web interface would otherwise be looked for under
# the (bind-mounted, UI-less) data directory instead.
x-node: &node
  build:
    context: .
    args:
      # Empty here on purpose: `crates/node/build.rs` falls back to reading git
      # when this is blank, and inside the builder that read always fails
      # (`.dockerignore` drops `.git/`, the image has no `git`). Build through
      # `scripts/build-docker.sh`, which exports the host's commit, or the
      # interface shows "desconhecido" for every container.
      POM_BUILD_COMMIT: ${POM_BUILD_COMMIT:-}
  image: pom:latest
  network_mode: host
  restart: always
  environment:
    POM_HOME: /data
    POM_UI_DIST: /app/apps/frontend/dist
    POM_PROFILE_SYNC: 1 

services:
  node-gpu:
    <<: *node
    container_name: pom-node-gpu
    volumes:
      - ${POM_SHARD_MODELS_DIR:-./models}:/data/models
      - ${POM_SOURCE_MODELS_DIR:-./source-models}:/data/source-models
      - ./tests/fixtures/node-gpu:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']

  node-gpu2:
    <<: *node
    container_name: pom-node-gpu2
    volumes:
      - ${POM_SHARD_MODELS_DIR:-./models}:/data/models
      - ${POM_SOURCE_MODELS_DIR:-./source-models}:/data/source-models
      - ./tests/fixtures/node-gpu-2:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['1']

