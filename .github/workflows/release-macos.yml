name: Release · macOS

# It only runs when you ask for it, on a GitHub-hosted macOS (Apple Silicon) runner. The
# private engine repository is reached with the PLUGIN_REPO_SSH_KEY secret. See
# `docs/subsystems/build-and-run.md`, "Release through GitHub Actions".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # A single job. On a hosted runner the interface used to be built separately, on a
  # Linux runner, because the macOS minute cost 10x; here there is no multiplier, and
  # splitting would only add a round trip of artifacts between two jobs that
  # would run on the same machine anyway - the runner serves one job at a time.
  build:
    name: macOS arm64 (Metal)
    runs-on: macos-14
    env:
      LLAMA_SOURCE: ${{ github.workspace }}/.ci-cache/llama.cpp
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CCACHE: sccache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare/cache the llama.cpp checkout
        id: llama-cache
        uses: ./.github/actions/llama-cache

      - uses: dtolnay/rust-toolchain@stable

      - name: Enable the build cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # No `Swatinem/rust-cache`: it exists to hand a `target/` to a
      # runner that starts empty. Here the workspace is the same between runs, the
      # `target/` is already there, and restoring over it would only spend time and disk.

      - name: Check the build tools
        run: |
          # The hosted image brings git and cmake; install whatever is missing with Homebrew.
          for p in cmake git; do command -v "$p" >/dev/null || brew install "$p"; done
          cmake --version | head -1

      # Pins the Node version the project uses in development, instead of whatever the
      # runner image has on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Web interface
        run: |
          npm ci
          npm run build
        working-directory: apps/frontend

      - name: SSH access to the engine repository (pom-plugin-llama.cpp)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PLUGIN_REPO_SSH_KEY }}

      - name: github.com key in known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Compile
        run: cargo build --release --locked -p node -p pom-plugin-host --features metal

      - name: Assemble the package
        run: |
          nome="pom-${{ inputs.version }}-aarch64-apple-darwin"
          # The workspace persists between runs on this runner: clearing the leftovers from
          # the previous release avoids packaging the old package along with it.
          rm -rf pacote pom-*.tar.gz "$nome"
          mkdir -p pacote/apps/frontend
          cp -R apps/frontend/dist pacote/apps/frontend/dist
          cp target/release/pom pacote/
          # Without the host beside the pom no plugin installs.
          cp target/release/pom-plugin-host pacote/
          cp README.md pacote/ 2>/dev/null || true

          # A Unix executable does not carry an icon: on macOS the one that shows it is the
          # .app bundle. The interface goes **also** inside the bundle,
          # beside the real binary, so the .app keeps working after being
          # dragged to /Applications.
          ./scripts/make-macos-app.sh target/release/pom "pacote/POM.app"
          mkdir -p "pacote/POM.app/Contents/Resources/apps/frontend"
          cp -R pacote/apps/frontend/dist "pacote/POM.app/Contents/Resources/apps/frontend/"

          mv pacote "$nome"
          tar czf "$nome.tar.gz" "$nome"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-macos
          path: pom-*.tar.gz
          if-no-files-found: error
          # Only they pass between the jobs of this run; the release keeps the packages.
          retention-days: 2

      # Each system publishes its own package on the same tag: the first workflow
      # to run creates the release, the others attach their file.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: pom-*.tar.gz
