<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090a10'/%3E%3Cpath d='M8 11h5.5M8 16h9M8 21h5.5' stroke='%238a7cff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='16' r='3' fill='%2343e0c8'/%3E%3C/svg%3E"
    />
    <title>CODAI-SERVER</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (function () {
        try {
          // Dark is the product's default; light is something the operator
          // chooses. The system preference does not get to decide, or a
          // daytime laptop would open the console in a theme nobody picked.
          var saved = localStorage.getItem("codai.theme");
          document.documentElement.dataset.theme =
            saved === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
