# Four-node local dev/test cluster (one NVIDIA card plus one Radeon).
#
# Host networking is required, same as the manual docker run --net host:
# P2P discovery broadcasts to 255.255.255.255:42777 and gateway/inference
# ports are reachable that way. Each configured node's pom.json must use
# distinct gateway_port, p2p_port, and inference_port values. The shared
# node-cpu service has distinct CLI fallback ports for a fresh setup without
# pom.json.
#
# State lives in each node's tests/fixtures directory. POM_UI_DIST is pinned
# to the image path because POM_HOME points to the bind-mounted /data volume.
#
# GPU visibility:
#   node-gpu    : NVIDIA 0 plus Radeon (/dev/dri)
#   node-gpu2   : NVIDIA 0 only
#   node-gpu-3  : Radeon (/dev/dri) only
#   node-cpu    : no GPU
# Other clusters are brought up from the pom-cluster-config repository. Shared
# build/runtime data is in docker-compose.common.yml.
# Secret of the engine release download (read only when POM_PLUGIN_LLAMA_RELEASE is set).
secrets:
  pom_gh_token:
    environment: POM_GH_TOKEN

services:
  node-gpu:
    extends:
      file: docker-compose.common.yml
      service: node-gpu
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']

  node-gpu2:
    extends:
      file: docker-compose.common.yml
      service: node-gpu2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']

  node-gpu-3:
    extends:
      file: docker-compose.common.yml
      service: node-gpu-3
    devices:
      - /dev/dri:/dev/dri

  node-cpu:
    extends:
      file: docker-compose.common.yml
      service: node-cpu
