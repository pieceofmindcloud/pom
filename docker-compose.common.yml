# Shared image, runtime environment, network, and data mounts.
# Host-specific entrypoints expose hardware; the one POM executable selects an available backend.
x-node: &node
  build:
    context: .
    target: ${POM_DOCKER_TARGET:-dev-runtime}
    # The Rust build fetches pom-plugin-llama.cpp (private) over SSH with the host agent.
    ssh:
      - default
    secrets:
      - pom_gh_token
    additional_contexts:
      llama-fork: ${POM_LLAMA_CPP_SOURCE_CONTEXT:-./llama.cpp}
    args:
      # Empty here on purpose: crates/node/build.rs falls back to reading git
      # when this is blank, and inside the builder that read always fails
      # (.dockerignore drops .git/, and the image has no git). Build through
      # scripts/build-docker.sh, which exports the host's commit.
      POM_BUILD_COMMIT: ${POM_BUILD_COMMIT:-}
      POM_RELEASE_VERSION: ${POM_RELEASE_VERSION:-}
      # Keys the Dockerfile's /build/target cache mount id. A bump of the
      # vendored llama.cpp fork gets a clean native tree instead of a stale
      # libllama.a. build-docker.sh exports it from the fork checkout.
      LLAMA_CPP_CACHE_KEY: ${LLAMA_CPP_CACHE_KEY:-unknown}
      POM_LLAMA_CPP_MODE: ${POM_LLAMA_CPP_MODE:-release}
      POM_LLAMA_CPP_RELEASE_TAG: ${POM_LLAMA_CPP_RELEASE_TAG:-}
      POM_LLAMA_CPP_RELEASE_REPOSITORY: ${POM_LLAMA_CPP_RELEASE_REPOSITORY:-pieceofmindcloud/llama.cpp}
      CUDA_RUNTIME_FLAVOR: ${CUDA_RUNTIME_FLAVOR:-runtime}
      POM_CUDA_ARCHITECTURES: ${POM_CUDA_ARCHITECTURES:-86;120}
      POM_CUDA_ARCH_CACHE_KEY: ${POM_CUDA_ARCH_CACHE_KEY:-86-120}
      RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-stable}
      # Tag of a published pom-plugin-llama.cpp release (e.g. v0.1.0). Empty = fetch the
      # locked commit over SSH. The release needs POM_GH_TOKEN (the pom_gh_token secret).
      POM_PLUGIN_LLAMA_RELEASE: ${POM_PLUGIN_LLAMA_RELEASE:-}
  image: pom:latest
  network_mode: host
  restart: always
  environment:
    POM_HOME: /data
    POM_DEV_MODE: 1
    POM_UI_DIST: /app/apps/frontend/dist
    POM_PLUGIN_HOST: /usr/local/bin/pom-plugin-host
    POM_BIN: /usr/local/bin/pom
    POM_DEV: 1
    POM_PROFILE_SYNC: 1
    POM_PROFILE: trace
    # NVIDIA stays on CUDA. Do not add graphics, which also exposes an
    # NVIDIA Vulkan ICD and can make the Vulkan backend enumerate that GPU.
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    POM_SLOT_PERSIST_PREFIX_CACHE: 1

secrets:
  pom_gh_token:
    environment: POM_GH_TOKEN

services:
  node-gpu:
    <<: *node
    container_name: pom-node-gpu
    volumes:
      - ${POM_SHARD_MODELS_DIR:-./models}:/data/models
      - ${POM_SOURCE_MODELS_DIR:-./source-models}:/data/source-models
      # Stable persistent root shared by user projects and plugin data. Keep it
      # separate from model volumes so plugin state survives model changes.
      - ${POM_WORKSPACE_DIR:-./workspace}:/data/workspace
      - ${POM_DEV_PLUGINS_DIR:-..}:/opt/pom/dev-plugins:rw
      - ./tests/fixtures/node-gpu:/data

  node-gpu2:
    <<: *node
    container_name: pom-node-gpu2
    volumes:
      - ${POM_SHARD_MODELS_DIR:-./models}:/data/models
      - ${POM_SOURCE_MODELS_DIR:-./source-models}:/data/source-models
      - ${POM_WORKSPACE_DIR:-./workspace}:/data/workspace
      - ${POM_DEV_PLUGINS_DIR:-..}:/opt/pom/dev-plugins:rw
      - ./tests/fixtures/node-gpu-2:/data

  node-gpu-3:
    <<: *node
    container_name: pom-node-gpu3
    volumes:
      - ${POM_SHARD_MODELS_DIR:-./models}:/data/models
      - ${POM_SOURCE_MODELS_DIR:-./source-models}:/data/source-models
      - ${POM_WORKSPACE_DIR:-./workspace}:/data/workspace
      - ${POM_DEV_PLUGINS_DIR:-..}:/opt/pom/dev-plugins:rw
      - ./tests/fixtures/node-gpu-3:/data

  node-cpu:
    <<: *node
    container_name: pom-node-cpu
    # Fresh setup has no pom.json to provide per-node ports yet. Keep its
    # temporary discovery and setup UI listeners distinct on host networking.
    command: ["--port", "42807", "--gateway-port", "8083"]
    volumes:
      - ${POM_SHARD_MODELS_DIR:-./models}:/data/models
      - ${POM_SOURCE_MODELS_DIR:-./source-models}:/data/source-models
      - ${POM_WORKSPACE_DIR:-./workspace}:/data/workspace
      - ${POM_DEV_PLUGINS_DIR:-..}:/opt/pom/dev-plugins:rw
      - ./tests/fixtures/node-cpu:/data
