# Four-node local dev/test cluster. This is the default Salem configuration.
#
# Host networking is required, same as the manual docker run --net host:
# P2P discovery broadcasts to 255.255.255.255:42777 and gateway/inference
# ports are reachable that way. Each node's pom.json must use distinct
# gateway_port, p2p_port, and inference_port values.
#
# State lives in each node's tests/fixtures directory. POM_UI_DIST is pinned
# to the image path because POM_HOME points to the bind-mounted /data volume.
#
# Salem GPU visibility:
#   node-gpu    : NVIDIA 0 plus Radeon (/dev/dri)
#   node-gpu2   : NVIDIA 0 only
#   node-gpu-3  : Radeon (/dev/dri) only
#   node-cpu    : no GPU
# Ksia has two NVIDIA RTX 5060 Ti and no Radeon. Set COMPOSE_FILE to
# docker-compose.ksia.yml there. Shared build/runtime data is in
# docker-compose.common.yml.
services:
  node-gpu:
    extends:
      file: docker-compose.common.yml
      service: node-gpu
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']

  node-gpu2:
    extends:
      file: docker-compose.common.yml
      service: node-gpu2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']

  node-gpu-3:
    extends:
      file: docker-compose.common.yml
      service: node-gpu-3
    devices:
      - /dev/dri:/dev/dri

  node-cpu:
    extends:
      file: docker-compose.common.yml
      service: node-cpu
