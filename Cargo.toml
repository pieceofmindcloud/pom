[package]
name = "rdma-p2p"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rdma-p2p"
path = "src/main.rs"

[features]
# Embed the committed bundle instead of rebuilding the interface, so cutting a
# release needs no Node. See build.rs for why this is the exception, not the
# default.
release-bundle = []
default = []
cuda    = ["llama-cpp-sys-2/cuda"]
metal   = ["llama-cpp-sys-2/metal"]

[dependencies]
llama-cpp-sys-2 = { version = "0.1.154", default-features = false }
half = "2"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
md-5 = "0.10"
memmap2 = "0.9"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
libp2p = { version = "0.56", features = [
    "tokio", "tcp", "dns", "noise", "yamux",
    "identify", "kad", "mdns", "gossipsub", "macros",
    "relay", "dcutr", "autonat", "request-response",
] }
pkarr = "6"
async-trait = "0.1"
# interpolate-folder-path: the bundle directory comes from build.rs via
# CODAI_UI_DIST. debug-embed: embed in debug builds too, otherwise a debug
# binary reads the bundle off disk at runtime and stops being self-contained.
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
mime_guess = "2"
zstd = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
